services:
  - type: web
    name: mandi-mood
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ADMIN_API_KEY
        value: apmc-vashi-secret-2026
      - key: ALLOWED_ORIGIN
        value: "*"
